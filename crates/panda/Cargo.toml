[package]
name = "panda"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"
description = "Panda Note desktop client (Zed-based)."

[lints]
workspace = true

[build-dependencies]
embed-resource = "3.0"

[[bin]]
name = "panda"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
assets.workspace = true
editor.workspace = true
fs.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
language.workspace = true
languages = { workspace = true, features = ["notes"] }
node_runtime.workspace = true
panda_api.workspace = true
panda_core.workspace = true
panda_index.workspace = true
panda_session.workspace = true
panda_store.workspace = true
panda_sync.workspace = true
panda_ui.workspace = true
platform_title_bar.workspace = true
release_channel.workspace = true
search.workspace = true
semver.workspace = true
settings.workspace = true
theme.workspace = true
theme_settings.workspace = true
vim.workspace = true
vim_mode_setting.workspace = true
zed_actions.workspace = true
